name: Snap Shot — recover previous version (one-off)

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: List and download recent versions
        continue-on-error: true
        env:
          APATTISON_MS_REFRESH_TOKEN: ${{ secrets.APATTISON_MS_REFRESH_TOKEN }}
        run: |
          mkdir -p recovery_out
          python snap_shot/list_versions.py 2>&1 | tee recovery_out/run.log

      - name: List _recovery folder
        continue-on-error: true
        env:
          APATTISON_MS_REFRESH_TOKEN: ${{ secrets.APATTISON_MS_REFRESH_TOKEN }}
        run: python snap_shot/list_recovery_folder.py 2>&1 | tee -a recovery_out/run.log


      - name: Count REM Comments in each recovered file
        continue-on-error: true
        run: |
          pip install openpyxl 2>&1 | tail -2
          python snap_shot/count_rem_comments.py 2>&1 | tee -a recovery_out/run.log

      - name: Print exact REM Comment locations in v02
        continue-on-error: true
        run: python snap_shot/print_rem_locations.py 2>&1 | tee -a recovery_out/run.log

      - name: Dump property block context
        continue-on-error: true
        run: python snap_shot/dump_context.py 2>&1 | tee -a recovery_out/run.log

      - name: Dump full block layout
        continue-on-error: true
        run: python snap_shot/dump_block_layout.py 2>&1 | tee -a recovery_out/run.log
      - name: Upload recovered files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snap-shot-versions
          path: recovery_out/
          retention-days: 7
          if-no-files-found: warn
