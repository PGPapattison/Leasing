name: Snap Shot — poll + comment-sync

on:
  schedule:
    # Every 15 minutes, 7 AM – 6 PM ET, Monday–Friday.
    # 11:00–22:00 UTC covers 7 AM–6 PM EDT (summer).
    # In EST (winter) that's 6 AM–5 PM local — acceptable per user.
    # Paused 2026-08-07 during REM Comment wipe investigation, restored
    # 2026-08-07 after L2 unit-normalization fix (commit d5106e8).
    # Extended 2026-08-11 to also run --mode=comment-sync on every fire
    # so REM comments reach ClickUp within ~15 min instead of next-day.
    - cron: '*/15 11-22 * * 1-5'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Bypass REM Comment safety guard AND 15-min race guard (use only when we know the drop or edit is intentional)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: snap-shot
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r snap_shot/requirements.txt

      # Step A: honor the ClickUp "Rebuild Snap Shot" checkbox.
      # If checked, this does a full nightly rebuild (which itself syncs
      # REM comments as part of the build) and unchecks the box. If not
      # checked, it's a no-op that exits in ~2 seconds.
      - name: Poll ClickUp checkbox and rebuild if checked
        id: poll
        env:
          APATTISON_MS_REFRESH_TOKEN: ${{ secrets.APATTISON_MS_REFRESH_TOKEN }}
          APPFOLIO_API_SECRET: ${{ secrets.APPFOLIO_API_SECRET }}
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          SHAREPOINT_FOLDER_PATH: "General/_Prudent Growth Operations, LLC/LEASING & ASSET MANAGEMENT/WORKING DOCS"
          SNAP_SHOT_FORCE_REBUILD: ${{ github.event.inputs.force_rebuild == 'true' && 'true' || 'false' }}
        run: python snap_shot/rebuild.py --mode=poll

      # Step B: fast REM-comment-only sync.
      # Runs on every fire so REMs see their notes land in ClickUp within
      # minutes. Skips itself internally if:
      #  * Every col-P comment already has a matching sha8 in Last Synced
      #    (no ClickUp/AppFolio calls made in that case), OR
      #  * A non-automation edit landed within RACE_CONDITION_WINDOW_MINUTES
      #    (defers to the next fire so we don't clobber Ann's in-flight work).
      # If Step A already did a full rebuild this run, Step B will see all
      # comments already synced and no-op quickly.
      - name: REM comment-sync
        env:
          APATTISON_MS_REFRESH_TOKEN: ${{ secrets.APATTISON_MS_REFRESH_TOKEN }}
          APPFOLIO_API_SECRET: ${{ secrets.APPFOLIO_API_SECRET }}
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          SHAREPOINT_FOLDER_PATH: "General/_Prudent Growth Operations, LLC/LEASING & ASSET MANAGEMENT/WORKING DOCS"
        run: python snap_shot/rebuild.py --mode=comment-sync
