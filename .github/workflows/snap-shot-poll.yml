name: Snap Shot — on-demand poll

on:
  schedule:
    # Every 15 minutes, 7 AM – 6 PM ET, Monday–Friday.
    # 11:00–22:00 UTC covers 7 AM–6 PM EDT (summer).
    # In EST (winter) that's 6 AM–5 PM local — acceptable per user.
    - cron: '*/15 11-22 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: snap-shot
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r snap_shot/requirements.txt

      - name: Poll ClickUp checkbox and rebuild if checked
        env:
          APATTISON_MS_REFRESH_TOKEN: ${{ secrets.APATTISON_MS_REFRESH_TOKEN }}
          APPFOLIO_API_SECRET: ${{ secrets.APPFOLIO_API_SECRET }}
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
        run: python snap_shot/rebuild.py --mode=poll
