name: Snap Shot — nightly rebuild

on:
  # [PAUSED 2026-08-07 — REM Comment wipe investigation] schedule:
    # [PAUSED] # 4:17 AM ET daily — 08:17 UTC (EDT) / 09:17 UTC (EST).
    # [PAUSED] # Offset from :00 on purpose — GitHub Actions throttles/drops on-the-hour
    # [PAUSED] # scheduled events under load, and 08:00 UTC is one of the busiest cron
    # [PAUSED] # slots globally. Moving to :17 dramatically improves reliability.
    # [PAUSED] # (Previously '0 8 * * *' — that slot fired 0 out of 2 expected times
    # [PAUSED] # after initial deploy, prompting this change on 2026-08-06.)
    # [PAUSED] # We schedule for 08:17 UTC year-round; during EST (Nov–Mar) it fires at
    # [PAUSED] # 3:17 AM local instead of 4:17 AM. Ann has confirmed either is fine.
    # [PAUSED] - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Bypass REM Comment safety guard AND 15-min race guard (use when file is open in Excel and we know changes are safe to overwrite)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: snap-shot
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r snap_shot/requirements.txt

      - name: Rebuild Snap Shot (nightly mode)
        env:
          APATTISON_MS_REFRESH_TOKEN: ${{ secrets.APATTISON_MS_REFRESH_TOKEN }}
          APPFOLIO_API_SECRET: ${{ secrets.APPFOLIO_API_SECRET }}
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          SNAP_SHOT_RACE_WINDOW_MIN: ${{ github.event.inputs.force_rebuild == 'true' && '0' || '15' }}
          SNAP_SHOT_FORCE_REBUILD: ${{ github.event.inputs.force_rebuild == 'true' && 'true' || 'false' }}
          SHAREPOINT_FOLDER_PATH: "General/_Prudent Growth Operations, LLC/LEASING & ASSET MANAGEMENT/WORKING DOCS"
        run: python snap_shot/rebuild.py --mode=nightly
