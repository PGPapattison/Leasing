name: Snap Shot backfill — Last Synced Hash (col Q → ClickUp field)

# One-time (idempotent) backfill: copies sha8 stamps from workbook col Q
# into the new ClickUp 'Last Synced Hash' custom field on every matching
# LAR task. Runs BEFORE the reader in rebuild.py is flipped so the first
# run of the refactored code sees "no change" instead of "post everything".
#
# Safe to re-run — reads current field values first and only writes when
# a task's field differs from the workbook stamp.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply writes? Leave unchecked for dry-run.'
        type: choice
        options: ['false', 'true']
        default: 'false'
      verbose:
        description: 'Verbose logging (per-row detail)?'
        type: choice
        options: ['false', 'true']
        default: 'true'

concurrency:
  group: snap-shot
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r snap_shot/requirements.txt

      - name: Run backfill
        env:
          APATTISON_MS_REFRESH_TOKEN: ${{ secrets.APATTISON_MS_REFRESH_TOKEN }}
          APPFOLIO_API_SECRET: ${{ secrets.APPFOLIO_API_SECRET }}
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          SHAREPOINT_FOLDER_PATH: "General/_Prudent Growth Operations, LLC/LEASING & ASSET MANAGEMENT/WORKING DOCS"
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then FLAGS="$FLAGS --apply"; fi
          if [ "${{ github.event.inputs.verbose }}" = "true" ]; then FLAGS="$FLAGS --verbose"; fi
          python snap_shot/backfill_last_synced_hash.py $FLAGS
