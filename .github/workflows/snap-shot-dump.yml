name: Snap Shot — dump for diagnosis

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install deps
        run: pip install requests openpyxl
      - name: Download and inspect
        env:
          APATTISON_MS_REFRESH_TOKEN: ${{ secrets.APATTISON_MS_REFRESH_TOKEN }}
        run: |
          python3 <<'PY'
          import os, requests, json
          from openpyxl import load_workbook

          r = requests.post(
              "https://login.microsoftonline.com/b2a05ba0-a5ea-4518-8560-c9d2b631798d/oauth2/v2.0/token",
              data={
                  "client_id": "d4aec1ec-50cc-46ee-b17e-dddedb03513b",
                  "grant_type": "refresh_token",
                  "refresh_token": os.environ["APATTISON_MS_REFRESH_TOKEN"],
                  "scope": "https://graph.microsoft.com/.default offline_access",
              })
          tok = r.json()["access_token"]
          H = {"Authorization": f"Bearer {tok}"}
          DRIVE = "b!pZNbE8crqEyv_uELcpbZMu7drhCzjelCqcwMMrJZLTSYJfXQhQnGRo9Sea2xcjR0"
          PATH = "General/_Prudent Growth Operations, LLC/LEASING & ASSET MANAGEMENT/WORKING DOCS/Leasing-Snap-Shot.xlsx"
          meta = requests.get(f"https://graph.microsoft.com/v1.0/drives/{DRIVE}/root:/{PATH}", headers=H).json()
          content = requests.get(f"https://graph.microsoft.com/v1.0/drives/{DRIVE}/items/{meta['id']}/content", headers=H).content
          open("/tmp/wb.xlsx","wb").write(content)
          print(f"Downloaded {len(content)} bytes")

          wb = load_workbook("/tmp/wb.xlsx")
          for sn in wb.sheetnames[:5]:
              ws = wb[sn]
              print(f"\n=== Sheet: {sn} ===")
              # Look for 'Broker Active Interest' rows
              for row in range(1, min(ws.max_row+1, 300)):
                  bval = ws.cell(row=row, column=2).value
                  if bval and 'Broker Active Interest' in str(bval):
                      cval = ws.cell(row=row, column=3).value
                      cell_c = ws.cell(row=row, column=3)
                      rh = ws.row_dimensions[row].height
                      wrap = cell_c.alignment.wrap_text if cell_c.alignment else None
                      valign = cell_c.alignment.vertical if cell_c.alignment else None
                      print(f"  row {row}: rh={rh} wrap={wrap} vertical={valign}")
                      print(f"    value ({len(cval or '')} chars): {repr(cval)[:200]}")
                      break
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: workbook
          path: /tmp/wb.xlsx
