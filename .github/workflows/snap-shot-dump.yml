name: Snap Shot — dump for diagnosis

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install deps
        run: pip install -r snap_shot/requirements.txt
      - name: Download and dump BAI extract
        env:
          APATTISON_MS_REFRESH_TOKEN: ${{ secrets.APATTISON_MS_REFRESH_TOKEN }}
        run: |
          python3 <<'PY'
          import os, sys, requests
          sys.path.insert(0, "snap_shot")
          from rebuild import extract_ann_edits
          from openpyxl import load_workbook

          r = requests.post(
              "https://login.microsoftonline.com/b2a05ba0-a5ea-4518-8560-c9d2b631798d/oauth2/v2.0/token",
              data={
                  "client_id": "d4aec1ec-50cc-46ee-b17e-dddedb03513b",
                  "grant_type": "refresh_token",
                  "refresh_token": os.environ["APATTISON_MS_REFRESH_TOKEN"],
                  "scope": "https://graph.microsoft.com/.default offline_access",
              })
          tok = r.json()["access_token"]
          H = {"Authorization": f"Bearer {tok}"}
          DRIVE = "b!pZNbE8crqEyv_uELcpbZMu7drhCzjelCqcwMMrJZLTSYJfXQhQnGRo9Sea2xcjR0"
          PATH = "General/_Prudent Growth Operations, LLC/LEASING & ASSET MANAGEMENT/WORKING DOCS/Leasing-Snap-Shot.xlsx"
          meta = requests.get(f"https://graph.microsoft.com/v1.0/drives/{DRIVE}/root:/{PATH}", headers=H).json()
          content = requests.get(f"https://graph.microsoft.com/v1.0/drives/{DRIVE}/items/{meta['id']}/content", headers=H).content
          print(f"Downloaded {len(content)} bytes")

          overrides, unit_notes, mr = extract_ann_edits(content)
          print(f"\nExtracted {len(overrides)} property overrides, {len(unit_notes)} unit notes.")
          bai_count = 0
          bai_populated = 0
          samples = []
          for pid, entry in overrides.items():
              notes = entry.get("_notes", {})
              bai = notes.get("broker_active_interest", "")
              bai_count += 1
              if bai and "awaiting weekly Broker Beat" not in bai:
                  bai_populated += 1
                  if len(samples) < 3:
                      samples.append((pid, entry.get("_property_name", "?"), bai))
          print(f"BAI keys total: {bai_count}, non-placeholder: {bai_populated}")
          for pid, pname, bai in samples:
              print(f"\n  PropertyId {pid}: {pname}")
              print(f"    BAI ({len(bai)} chars): {repr(bai)}")
          PY
