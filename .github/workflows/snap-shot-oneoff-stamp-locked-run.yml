name: Snap Shot — one-off stamp locked run (2026-08-12)

# One-shot workflow to surgically stamp col Q for the 10 REM comments
# that were posted to ClickUp during the failed 2026-08-12 10:42 AM ET
# poll run (GitHub Actions run 31608260834) but never got their
# Last-Synced sha8 saved back to SharePoint (because HTTP 423 rejected
# the upload).
#
# Without this fix, the next successful comment-sync run will see those
# 10 col-P values as "still pending" and post duplicate ClickUp comments.
#
# This workflow runs the surgical fix in one of two modes via
# workflow_dispatch input:
#   * dry-run: reports what it WOULD stamp; makes no changes.
#   * apply: actually stamps col Q and uploads the workbook.
#
# Delete this workflow file after the apply run succeeds — it's a
# one-time cleanup. The permanent lock-safe path (commit 4237c88)
# prevents future occurrences of this class of failure.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run reports only; apply actually stamps + uploads'
        required: true
        default: 'dry-run'
        type: choice
        options: ['dry-run', 'apply']

concurrency:
  group: snap-shot
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r snap_shot/requirements.txt

      - name: Run one-off stamp
        env:
          APATTISON_MS_REFRESH_TOKEN: ${{ secrets.APATTISON_MS_REFRESH_TOKEN }}
          APPFOLIO_API_SECRET: ${{ secrets.APPFOLIO_API_SECRET }}
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          SHAREPOINT_FOLDER_PATH: "General/_Prudent Growth Operations, LLC/LEASING & ASSET MANAGEMENT/WORKING DOCS"
        run: |
          if [ "${{ github.event.inputs.mode }}" = "apply" ]; then
            python snap_shot/one_off_stamp_locked_run.py --apply
          else
            python snap_shot/one_off_stamp_locked_run.py
          fi
