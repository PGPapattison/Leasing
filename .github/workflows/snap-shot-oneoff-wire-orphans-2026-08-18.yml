name: Snap Shot — one-off wire orphans (2026-08-18)

# One-shot workflow to catch up the 5 REM comments that orphaned on the
# 2026-08-12 comment-sync run because their ClickUp tasks either hadn't
# been created yet or had unit labels that missed the (pid, unit) lookup
# ("181 - B1" vs "181-B1").
#
# Two modes via workflow_dispatch input:
#   * dry-run: report ONLY what it would set, post, and stamp. No mutations.
#   * apply: set Property ID + Tenant ID (as configured per task), post the
#     REM comment, and stamp col Q with the sha8 hash.
#
# Delete this workflow file after the apply run succeeds — it's a
# one-time catch-up. The durable normalizer fix (this commit's rebuild.py
# change) prevents future hyphen-padding orphans.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run reports only; apply mutates ClickUp + SharePoint'
        required: true
        default: 'dry-run'
        type: choice
        options: ['dry-run', 'apply']

concurrency:
  group: snap-shot
  cancel-in-progress: false

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r snap_shot/requirements.txt

      - name: Run one-off wire orphans
        env:
          APATTISON_MS_REFRESH_TOKEN: ${{ secrets.APATTISON_MS_REFRESH_TOKEN }}
          APPFOLIO_API_SECRET: ${{ secrets.APPFOLIO_API_SECRET }}
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          SHAREPOINT_FOLDER_PATH: "General/_Prudent Growth Operations, LLC/LEASING & ASSET MANAGEMENT/WORKING DOCS"
        run: |
          if [ "${{ github.event.inputs.mode }}" = "apply" ]; then
            python snap_shot/one_off_wire_orphans_2026_08_18.py --apply
          else
            python snap_shot/one_off_wire_orphans_2026_08_18.py
          fi
