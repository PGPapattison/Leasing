name: Snap Shot — inspect note rows

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install deps
        run: pip install requests openpyxl
      - name: Inspect
        env:
          APATTISON_MS_REFRESH_TOKEN: ${{ secrets.APATTISON_MS_REFRESH_TOKEN }}
        run: |
          python3 <<'PY'
          import os, requests
          from openpyxl import load_workbook
          r = requests.post(
              "https://login.microsoftonline.com/b2a05ba0-a5ea-4518-8560-c9d2b631798d/oauth2/v2.0/token",
              data={
                  "client_id": "d4aec1ec-50cc-46ee-b17e-dddedb03513b",
                  "grant_type": "refresh_token",
                  "refresh_token": os.environ["APATTISON_MS_REFRESH_TOKEN"],
                  "scope": "https://graph.microsoft.com/.default offline_access",
              })
          tok = r.json()["access_token"]
          H = {"Authorization": f"Bearer {tok}"}
          DRIVE = "b!pZNbE8crqEyv_uELcpbZMu7drhCzjelCqcwMMrJZLTSYJfXQhQnGRo9Sea2xcjR0"
          PATH = "General/_Prudent Growth Operations, LLC/LEASING & ASSET MANAGEMENT/WORKING DOCS/Leasing-Snap-Shot.xlsx"
          meta = requests.get(f"https://graph.microsoft.com/v1.0/drives/{DRIVE}/root:/{PATH}", headers=H).json()
          content = requests.get(f"https://graph.microsoft.com/v1.0/drives/{DRIVE}/items/{meta['id']}/content", headers=H).content
          open("/tmp/wb.xlsx","wb").write(content)
          wb = load_workbook("/tmp/wb.xlsx")
          ws = wb["Snap Shot"]

          # Find Barker Cypress and Castle Shops property blocks. Property name is
          # typically in col B in a header row. Scan col B for those names.
          targets = ["Barker Cypress", "Castle Shops"]
          for target in targets:
              found_row = None
              for row in range(1, ws.max_row + 1):
                  v = ws.cell(row=row, column=2).value
                  if isinstance(v, str) and target.lower() in v.lower():
                      found_row = row
                      break
              print(f"\n===== {target} (header row {found_row}) =====")
              if not found_row:
                  continue
              # Show the next 20 rows: label + value + row_height
              for r in range(found_row, min(found_row + 20, ws.max_row + 1)):
                  h = ws.row_dimensions[r].height
                  label = ws.cell(row=r, column=2).value or ""
                  val = ws.cell(row=r, column=3).value or ""
                  label_s = (str(label)[:50] + "…") if len(str(label)) > 50 else str(label)
                  val_s = (str(val)[:80] + "…") if len(str(val)) > 80 else str(val)
                  print(f"  row {r}: h={h!r:>7}  B={label_s!r:<52}  C={val_s!r}")
          PY
