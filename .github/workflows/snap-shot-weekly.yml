name: Snap Shot — weekly Broker Beat refresh

on:
  # [PAUSED 2026-08-07 — REM Comment wipe investigation] schedule:
    # [PAUSED] # 5:00 AM ET Mondays — 09:00 UTC (EDT) / 10:00 UTC (EST).
    # [PAUSED] # Same DST caveat as nightly; runs before the office opens either way.
    # [PAUSED] # 5:23 AM ET Mondays — 09:23 UTC (EDT) / 10:23 UTC (EST). Offset from :00
    # [PAUSED] # for the same reason as the nightly: GitHub Actions drops on-the-hour
    # [PAUSED] # scheduled events under load.
    # [PAUSED] - cron: '23 9 * * 1'
  workflow_dispatch: {}

concurrency:
  group: snap-shot
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30    # weekly mode does extra ClickUp attachment pulls

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r snap_shot/requirements.txt

      - name: Rebuild Snap Shot (weekly mode — refreshes Broker Active Interest)
        env:
          APATTISON_MS_REFRESH_TOKEN: ${{ secrets.APATTISON_MS_REFRESH_TOKEN }}
          APPFOLIO_API_SECRET: ${{ secrets.APPFOLIO_API_SECRET }}
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          SHAREPOINT_FOLDER_PATH: "General/_Prudent Growth Operations, LLC/LEASING & ASSET MANAGEMENT/WORKING DOCS"
        run: python snap_shot/rebuild.py --mode=weekly
